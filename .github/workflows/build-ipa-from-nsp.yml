# Build an unsigned iOS IPA from user-supplied NSP URLs. Game files and keys stay in the runner;
# only the IPA and diagnostic logs are uploaded as artifacts.
name: build-ipa-from-nsp

on:
  workflow_dispatch:
    inputs:
      base_nsp_url:
        description: Direct HTTPS download URL for the base-game .nsp
        required: true
        type: string
      update_nsp_url:
        description: Optional direct HTTPS download URL for an update .nsp
        required: false
        type: string
      keys_zip_url:
        description: Direct HTTPS download URL for a ZIP containing prod.keys and title.keys
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  PYTHON_VERSION: '3.14'

jobs:
  build:
    name: Download, inspect and build unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Check out nxnative
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Validate toolchain
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR" || { echo "::error::Xcode 27.2 is missing from this runner"; exit 1; }
          xcodebuild -version
          python --version
          python - <<'PY'
          import sys
          if sys.version_info < (3, 12):
              raise SystemExit("nxnative requires Python 3.12 or newer")
          PY
          xcodebuild -downloadComponent MetalToolchain
          xcrun --find metal
          xcrun --find metallib

      - name: Install nxnative build tools
        run: |
          set -euo pipefail
          brew install xcodegen zstd glslang
          python -m pip install --disable-pip-version-check \
            lz4 "capstone>=5,<6" fonttools nsz zbic \
            "backports.zstd; python_version < '3.14'"
          xcodegen --version
          zstd --version

      - name: Download game and keys
        env:
          BASE_NSP_URL: ${{ inputs.base_nsp_url }}
          UPDATE_NSP_URL: ${{ inputs.update_nsp_url }}
          KEYS_ZIP_URL: ${{ inputs.keys_zip_url }}
        run: |
          set -euo pipefail
          # Mask the complete input strings before any downloader can echo an error containing them.
          echo "::add-mask::$BASE_NSP_URL"
          if [[ -n "$UPDATE_NSP_URL" ]]; then
            echo "::add-mask::$UPDATE_NSP_URL"
          fi
          echo "::add-mask::$KEYS_ZIP_URL"

          python - <<'PY'
          import os
          from urllib.parse import urlparse

          for key in ("BASE_NSP_URL", "KEYS_ZIP_URL"):
              value = os.environ.get(key, "").strip()
              parsed = urlparse(value)
              if parsed.scheme != "https" or not parsed.netloc:
                  raise SystemExit(f"{key} must be a direct HTTPS URL")
          value = os.environ.get("UPDATE_NSP_URL", "").strip()
          if value:
              parsed = urlparse(value)
              if parsed.scheme != "https" or not parsed.netloc:
                  raise SystemExit("UPDATE_NSP_URL must be a direct HTTPS URL when supplied")
          PY

          mkdir -p "$RUNNER_TEMP/nxnative-input/game" "$RUNNER_TEMP/nxnative-input/keys"
          # Match the working downloader's direct curl-to-file flow. Some file hosts
          # reject curl's default user agent, so identify this request as a normal client.
          download_file() {
            local url="$1" destination="$2" label="$3"
            echo "Downloading $label..."
            curl -fL --retry 5 --retry-all-errors --connect-timeout 30 \
              --user-agent "Mozilla/5.0 (Macintosh; Intel Mac OS X) AppleWebKit/537.36 Chrome/131.0 Safari/537.36" \
              -sS -o "$destination" "$url"
            [[ -s "$destination" ]] || { echo "::error::$label download produced an empty file"; return 1; }
            ls -lh "$destination"
            file "$destination" | cut -c1-160
          }

          download_file "$BASE_NSP_URL" "$RUNNER_TEMP/nxnative-input/game/base.nsp" "base NSP"
          if [[ -n "$UPDATE_NSP_URL" ]]; then
            download_file "$UPDATE_NSP_URL" "$RUNNER_TEMP/nxnative-input/game/update.nsp" "update NSP"
          fi
          download_file "$KEYS_ZIP_URL" "$RUNNER_TEMP/nxnative-input/keys/keys.zip" "keys ZIP"

          # Extract only the two requested key files; never unpack arbitrary ZIP paths into the workspace.
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile

          root = Path(__import__("os").environ["RUNNER_TEMP"]) / "nxnative-input"
          archive = root / "keys" / "keys.zip"
          out = root / "keys"
          try:
              with ZipFile(archive) as z:
                  for wanted in ("prod.keys", "title.keys"):
                      matches = [
                          item for item in z.infolist()
                          if not item.is_dir()
                          and item.filename.replace("\\", "/").rsplit("/", 1)[-1].lower() == wanted
                      ]
                      if len(matches) != 1:
                          raise SystemExit(f"Keys ZIP must contain exactly one {wanted}")
                      item = matches[0]
                      if item.file_size <= 0 or item.file_size > 16 * 1024 * 1024:
                          raise SystemExit(f"Unexpected size for {wanted}")
                      (out / wanted).write_bytes(z.read(item))
          except BadZipFile as exc:
              raise SystemExit(f"Invalid keys ZIP: {exc}")
          PY
          chmod 600 "$RUNNER_TEMP/nxnative-input/keys/"*.keys
          rm -f "$RUNNER_TEMP/nxnative-input/keys/keys.zip"
          echo "Game inputs downloaded; keys validated (values are never printed)."
          du -sh "$RUNNER_TEMP/nxnative-input/game"

      - name: Build unsigned IPA with nxnative
        env:
          GAME_DIR: ${{ runner.temp }}/nxnative-input/game
          PROD_KEYS: ${{ runner.temp }}/nxnative-input/keys/prod.keys
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nxnative-output"
          python scripts/build_ipa_from_nsp.py "$GAME_DIR" \
            --keys "$PROD_KEYS" \
            --progress lines \
            --no-keep-extracted

      - name: Collect IPA and diagnostics
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nxnative-output"
          if [[ -d "$RUNNER_TEMP/nxnative-input/game" ]]; then
            find "$RUNNER_TEMP/nxnative-input/game" -maxdepth 2 -type f -name '*.ipa' \
              -exec cp -f {} "$RUNNER_TEMP/nxnative-output/" \; 2>/dev/null || true
            # TrollStore accepts the same unsigned IPA package with the .tipa extension.
            for ipa in "$RUNNER_TEMP/nxnative-output/"*.ipa; do
              [[ -f "$ipa" ]] || continue
              cp -f "$ipa" "${ipa%.ipa}.tipa"
            done
            find "$RUNNER_TEMP/nxnative-input/game" -maxdepth 2 -type d -name '*_build' \
              -exec sh -c 'mkdir -p "$1/$(basename "$2")"; if [ -d "$2/logs" ]; then cp -R "$2/logs" "$1/$(basename "$2")/"; fi' _ "$RUNNER_TEMP/nxnative-output" {} \; 2>/dev/null || true
            find "$RUNNER_TEMP/nxnative-input/game" -maxdepth 2 -type d -name '*_survey' \
              -exec cp -R {} "$RUNNER_TEMP/nxnative-output/" \; 2>/dev/null || true
          fi
          find "$RUNNER_TEMP/nxnative-output" -maxdepth 3 -type f -print

      - name: Upload IPA and build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nxnative-ipa-and-logs-${{ github.run_number }}
          path: ${{ runner.temp }}/nxnative-output/
          if-no-files-found: warn
          retention-days: 7
